<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum de San Valentín 💖</title>
  <link rel="stylesheet" href="album.css">
</head>
<body>
  <div class="album-container">
    <header>

        <img src="foto1.jpg" alt="Recuerdo especial">

      </div>
      <div class="photo">
        <img src="foto2.jpg" alt="Un momento inolvidable">
        <div class="hover-heart">💖</div>
      </div>
      <div class="photo">
        <img src="foto3.jpg" alt="Nuestro mejor día juntos">
        <div class="hover-heart">💘</div>
      </div>
      <div class="photo">
        <img src="foto4.jpg" alt="Día mágico">
        <div class="hover-heart">💞</div>
      </div>
      <div class="photo">
        <img src="foto5.jpg" alt="Siempre juntos">
        <div class="hover-heart">💕</div>
      </div>
      <div class="photo">
        <img src="foto6.jpg" alt="Nuestro amor eterno">
        <div class="hover-heart">💓</div>
      </div>
    </div>
    <footer>
      <button onclick="window.history.back()">Volver a la Carta</button>
    </footer>
  </div>

</html>

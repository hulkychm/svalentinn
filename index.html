<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación de San Valentín 💌</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card-container floating-hearts">
    <div class="card">
      <div class="card-front">
        <div class="heart-icon">❤️</div>
        <h1>¡Invitacion a San Valentin!</h1>
        <button onclick="abrirCarta()">Abrir Carta</button>
      </div>
      <div class="card-back">
        <div class="heart-icon">❤️</div>
        <h2>Para mi kekito ❤️</h2>
        <p>Deseo que seas mi Valentine el 14 de febrero y esta es la manera en la que te expreso este sentimiento!</p>
        <p>Espero aceptes mi peticion y podamos pasar el dia de San valentin juntitos!</p>
        <button onclick="cerrarCarta()">Cerrar Carta</button>
        <button id="album-button" onclick="window.location.href='album.html'">Aceptar</button>
      </div>
    </div>
  </div>
</body>
<script src="script.js"></script>
</html>
